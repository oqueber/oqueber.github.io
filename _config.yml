#  oqueber.com — site settings
#  You rarely need to touch this file. Content lives in /content:
#    content/cv/index.md          → CV (Spanish + English)
#    content/_lab/YYYY/MM/DD/slug → Lab articles + their photos, audio, code
#    content/brainstorm/index.md  → links & personal stuff
#    content/_tools/<slug>        → tool wiki (one page per tool, linked from articles)

title       : Oqueber Navarro
description : Ingeniero de firmware embebido e inventor en Madrid (C, Zephyr, FreeRTOS, STM32, IoT). Convierto ideas en aparatos que funcionan.
url         : "https://oqueber.com"
baseurl     : ""
lang        : es

author:
  name     : Oqueber Navarro
  github   : oqueber
  linkedin : oqueber
  thingiverse : oqueber

# Repo used for the "your turn" buttons in each article (opens a GitHub issue).
repository: oqueber/oqueber.github.io

# Optional comments under each article via giscus (GitHub Discussions).
# 1. Enable Discussions on the repo  2. install https://github.com/apps/giscus
# 3. copy repo_id and category_id from https://giscus.app  4. set enabled: true
giscus:
  enabled     : false
  repo_id     : ""
  category    : "Lab"
  category_id : ""

collections_dir: content
collections:
  lab:
    output    : true
    permalink : /lab/:path:output_ext
  tools:                                   # wiki: content/_tools/<slug>/index.md
    output    : true
    permalink : /brainstorm/tools/:path:output_ext

defaults:
  - scope: { path: "" }
    values: { lang: es }
  - scope: { path: "", type: lab }
    values:
      layout : article
      status : idea
      cover  : poster.jpg
  - scope: { path: "", type: tools }
    values:
      layout : tool
      image  : photo.jpg
      alt    : /en/brainstorm/

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# Stop the build on broken front matter (e.g. a stray ":" in a title) instead of skipping the page.
strict_front_matter: true

exclude:
  - README.md
  - scripts/
  - new-idea.ps1
  - new-tool.ps1
  - Gemfile
  - Gemfile.lock
  - "*.log"
